AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  Layer 4 of 4 - ML platform. Network-isolated SageMaker Studio domain, VPC
  endpoints for every service the workload needs, a model package group for
  governed promotion, and a Bedrock guardrail for the clinical summarisation
  use case. The data science environment reaches the de-identified zone only.
  Depends on the exports of 01-foundation-data-lake and 02-governance.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Stack wiring
        Parameters:
          - FoundationStackName
      - Label:
          default: Naming
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: Network
        Parameters:
          - VpcCidr
          - PrivateSubnetACidr
          - PrivateSubnetBCidr

Parameters:
  FoundationStackName:
    Type: String
    Default: hcls-lake-foundation
    # This layer imports only from the foundation stack. The Studio execution
    # role here is a service role for sagemaker.amazonaws.com, distinct from
    # the human DataScientistRole in 02-governance that federates into Studio;
    # neither needs to reference the other.

  ProjectName:
    Type: String
    Default: hcls-lake
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,10}[a-z0-9]$'
    ConstraintDescription: Lowercase alphanumerics and hyphens, 3-12 characters.

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/(1[6-9]|2[0-8])$'
    ConstraintDescription: Must be a valid IPv4 CIDR between /16 and /28.

  PrivateSubnetACidr:
    Type: String
    Default: 10.40.1.0/24
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/(1[6-9]|2[0-8])$'

  PrivateSubnetBCidr:
    Type: String
    Default: 10.40.2.0/24
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/(1[6-9]|2[0-8])$'

Resources:

  # ===========================================================================
  # Network
  #
  # Private subnets with no NAT gateway and no internet gateway. Every AWS API
  # the workload needs is reached through a VPC endpoint, so clinical data has
  # no network path off the VPC at all. This is a stronger control than
  # egress filtering, because there is nothing to filter -- and it removes the
  # NAT gateway line item, which on a busy training account is not small.
  #
  # The cost is real: any Python package not already in the container image
  # must come from a private repository, because pip cannot reach PyPI.
  # See docs/adr/0007-network-isolation-for-the-ml-environment.md
  # ===========================================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      # Required for interface endpoint private DNS to resolve.
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-ml'
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # VPC flow logs: without these, the network layer is the one part of the
  # architecture with no audit record, which is awkward to explain in a
  # 164.312(b) review.
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/vpc/${ProjectName}-${Environment}-ml'
      RetentionInDays: 365
      KmsKeyId: !GetAtt LogsEncryptionKey.Arn

  LogsEncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${ProjectName} ${Environment} - ML platform CloudWatch logs'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'
            Condition:
              ArnLike:
                'kms:EncryptionContext:aws:logs:arn':
                  !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      Policies:
        - PolicyName: WriteFlowLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !GetAtt FlowLogGroup.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private-b'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-private'
    # No routes are defined. The only entry is the implicit local route plus
    # the S3 gateway endpoint association below -- there is deliberately no
    # 0.0.0.0/0 target anywhere in this template.

  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Self-referencing: SageMaker Studio requires the domain security group to
  # permit intra-group traffic for kernel gateway to app communication.
  MlSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SageMaker Studio and VPC endpoint traffic
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS to VPC endpoints within the VPC
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-ml'

  MlSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MlSecurityGroup
      Description: Intra-group traffic for SageMaker Studio apps
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref MlSecurityGroup

  # ---------------------------------------------------------------------------
  # VPC endpoints
  #
  # S3 is a gateway endpoint (no hourly charge, routed); the rest are interface
  # endpoints backed by ENIs. Dropping any one of these breaks Studio in a way
  # that presents as an unhelpful timeout, so the list is deliberately complete
  # rather than minimal.
  # ---------------------------------------------------------------------------

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Endpoint policy as a second boundary: even if an IAM policy were
          # widened by mistake, this endpoint reaches the de-identified zone
          # and the SageMaker service buckets, and nothing else. The PHI zones
          # are not routable from this VPC.
          - Sid: DeIdentifiedZoneAndServiceBucketsOnly
            Effect: Allow
            Principal: '*'
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
            Resource:
              - !ImportValue
                  'Fn::Sub': '${FoundationStackName}-DeIdentifiedZoneBucketArn'
              - !Sub
                - '${BucketArn}/*'
                - BucketArn: !ImportValue
                    'Fn::Sub': '${FoundationStackName}-DeIdentifiedZoneBucketArn'
              - !Sub 'arn:${AWS::Partition}:s3:::sagemaker-${AWS::Region}-${AWS::AccountId}'
              - !Sub 'arn:${AWS::Partition}:s3:::sagemaker-${AWS::Region}-${AWS::AccountId}/*'
              # Amazon-owned buckets holding the managed container images.
              - !Sub 'arn:${AWS::Partition}:s3:::prod-${AWS::Region}-starport-layer-bucket/*'

  SageMakerApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sagemaker.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  SageMakerRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sagemaker.runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  SageMakerStudioEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'aws.sagemaker.${AWS::Region}.studio'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sts'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  KmsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref MlSecurityGroup]

  # ===========================================================================
  # SageMaker
  # ===========================================================================

  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-sagemaker-execution'
      Description: Studio execution role. De-identified data only.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSageMakerFullAccess'
      Policies:
        - PolicyName: DeIdentifiedDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDeIdentifiedZone
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !ImportValue
                      'Fn::Sub': '${FoundationStackName}-DeIdentifiedZoneBucketArn'
                  - !Sub
                    - '${BucketArn}/*'
                    - BucketArn: !ImportValue
                        'Fn::Sub': '${FoundationStackName}-DeIdentifiedZoneBucketArn'
              - Sid: UseDeIdentifiedKey
                Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:GenerateDataKey'
                  - 'kms:DescribeKey'
                Resource: !ImportValue
                  'Fn::Sub': '${FoundationStackName}-DeIdentifiedEncryptionKeyArn'
        - PolicyName: DenyPhiZones
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # An explicit Deny that no later Allow can override. The managed
              # AmazonSageMakerFullAccess policy above is broad by design, and
              # this is what stops it from becoming a path into PHI. Explicit
              # Deny beats any Allow in IAM evaluation, so this holds even if
              # someone attaches a wider policy tomorrow.
              - Sid: NoPhiZoneAccess
                Effect: Deny
                Action: 's3:*'
                Resource:
                  - !ImportValue
                      'Fn::Sub': '${FoundationStackName}-LandingZoneBucketArn'
                  - !Sub
                    - '${BucketArn}/*'
                    - BucketArn: !ImportValue
                        'Fn::Sub': '${FoundationStackName}-LandingZoneBucketArn'
                  - !ImportValue
                      'Fn::Sub': '${FoundationStackName}-ConformedZoneBucketArn'
                  - !Sub
                    - '${BucketArn}/*'
                    - BucketArn: !ImportValue
                        'Fn::Sub': '${FoundationStackName}-ConformedZoneBucketArn'
              - Sid: NoPhiKeyAccess
                Effect: Deny
                Action: 'kms:*'
                Resource: !ImportValue
                  'Fn::Sub': '${FoundationStackName}-PhiEncryptionKeyArn'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DataAccess
          Value: DeIdentifiedOnly
        - Key: ManagedBy
          Value: CloudFormation

  StudioDomain:
    Type: AWS::SageMaker::Domain
    Properties:
      DomainName: !Sub '${ProjectName}-${Environment}-studio'
      AuthMode: IAM
      VpcId: !Ref Vpc
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      # VpcOnly, not PublicInternetOnly. With PublicInternetOnly, Studio
      # traffic leaves through a SageMaker-managed network interface outside
      # this VPC, where neither the endpoint policies nor the flow logs above
      # apply.
      AppNetworkAccessType: VpcOnly
      KmsKeyId: !ImportValue
        'Fn::Sub': '${FoundationStackName}-DeIdentifiedEncryptionKeyArn'
      DefaultUserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        SecurityGroups: [!Ref MlSecurityGroup]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: DeIdentified
        - Key: ManagedBy
          Value: CloudFormation

  # Models are promoted through a registry rather than deployed from a
  # notebook. In a clinical setting the provenance question -- which data,
  # which code, which approval produced the model now influencing care -- is
  # not answerable if deployment starts from someone's kernel session.
  ReadmissionModelGroup:
    Type: AWS::SageMaker::ModelPackageGroup
    Properties:
      ModelPackageGroupName: !Sub '${ProjectName}-${Environment}-readmission-risk'
      ModelPackageGroupDescription: >-
        30-day unplanned readmission risk. Requires a bias report from
        SageMaker Clarify against age, sex, race, and payer before any package
        may be moved to Approved.
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ClinicalUse
          Value: DecisionSupport
        - Key: ManagedBy
          Value: CloudFormation

  # ===========================================================================
  # Bedrock guardrail for clinical note summarisation
  # ===========================================================================

  ClinicalSummarisationGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-clinical-summarisation'
      Description: >-
        Guardrail for clinician-facing note summarisation. Anonymises
        identifiers that survive into prompts and blocks prompt-injection
        attempts against a model with clinical context in scope.
      BlockedInputMessaging: >-
        This request cannot be processed. Contact the clinical informatics team
        if you believe this is in error.
      BlockedOutputsMessaging: >-
        This response was withheld by a safety filter. The source note is
        unchanged and remains available in the chart.
      ContentPolicyConfig:
        FiltersConfig:
          # Deliberately not filtering VIOLENCE or SEXUAL at high strength:
          # clinical documentation legitimately describes assault, self-harm,
          # and sexual health, and over-filtering those categories degrades
          # summaries of exactly the encounters where accuracy matters most.
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
          - Type: MISCONDUCT
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          # ANONYMIZE rather than BLOCK: a summary that fails outright because
          # a name appeared is useless to the clinician, whereas a masked
          # summary is still clinically actionable.
          - Type: NAME
            Action: ANONYMIZE
          - Type: EMAIL
            Action: ANONYMIZE
          - Type: PHONE
            Action: ANONYMIZE
          - Type: ADDRESS
            Action: ANONYMIZE
          - Type: AGE
            Action: ANONYMIZE
          - Type: US_SOCIAL_SECURITY_NUMBER
            Action: BLOCK
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  VpcId:
    Description: Isolated VPC hosting the ML environment
    Value: !Ref Vpc
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  StudioDomainId:
    Description: SageMaker Studio domain identifier
    Value: !GetAtt StudioDomain.DomainId
    Export:
      Name: !Sub '${AWS::StackName}-StudioDomainId'

  SageMakerExecutionRoleArn:
    Description: Studio execution role, de-identified data only
    Value: !GetAtt SageMakerExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SageMakerExecutionRoleArn'

  ReadmissionModelGroupArn:
    Description: Model package group for the readmission risk model
    Value: !GetAtt ReadmissionModelGroup.ModelPackageGroupArn
    Export:
      Name: !Sub '${AWS::StackName}-ReadmissionModelGroupArn'

  GuardrailId:
    Description: Bedrock guardrail for clinical summarisation
    Value: !GetAtt ClinicalSummarisationGuardrail.GuardrailId
    Export:
      Name: !Sub '${AWS::StackName}-GuardrailId'
